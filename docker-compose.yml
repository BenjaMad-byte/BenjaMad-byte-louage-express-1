services:
  driver-portal:
    build:
      context: .
      dockerfile: driver-portal/Dockerfile
    ports:
      - "4100:4100"
    environment:
      NODE_ENV: development
      PORT: 4100
      DATA_DIR: /data
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      OTP_SECRET: ${PORTAL_OTP_SECRET}
      APP_SERVICE_KEY: ${APP_SERVICE_KEY}
      APP_URL: http://driver-app:4200
      APP_OPS_KEY: ${OPS_SERVICE_KEY}
      # Chiffrement au repos des CIN/permis/selfies. Sans elle, les pièces sont stockées EN CLAIR (voir security.js).
      DATA_KEY: ${DATA_KEY}
      DATA_KEY_PREVIOUS: ${DATA_KEY_PREVIOUS:-}
    volumes:
      - portal-data:/data
      - portal-backups:/backups
    restart: unless-stopped

  driver-app:
    build:
      context: .
      dockerfile: driver-app/Dockerfile
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: development
      PORT: 4200
      DATA_DIR: /data
      OTP_SECRET: ${APP_OTP_SECRET}
      PORTAL_URL: http://driver-portal:4100
      APP_SERVICE_KEY: ${APP_SERVICE_KEY}
      OPS_SERVICE_KEY: ${OPS_SERVICE_KEY}
    volumes:
      - app-data:/data
    depends_on:
      - driver-portal
    restart: unless-stopped

volumes:
  portal-data:
  portal-backups:
  app-data:
