name: Android — build APK (debug)

# Déclenchement manuel seulement (onglet Actions → ce workflow → Run workflow) : un build Android est lourd,
# inutile de le lancer à chaque push. L'APK produit n'est PAS signé pour le Play Store (voir docs/android.md) :
# il sert à installer l'application sur un vrai téléphone pour tester avant la mise en boutique.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Installer les dépendances et régénérer les fichiers Capacitor (non versionnés : capacitor-cordova-android-plugins)"
        run: |
          npm ci
          npx cap sync android
        working-directory: driver-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest fournit déjà le SDK Android (ANDROID_HOME) : pas besoin d'une action tierce pour l'installer.
      - name: Accepter les licences du SDK Android (déjà installé sur ce runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew
        working-directory: driver-app/android

      - name: Construire l'APK debug
        run: ./gradlew assembleDebug
        working-directory: driver-app/android

      - uses: actions/upload-artifact@v4
        with:
          name: louage-chauffeur-debug-apk
          path: driver-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
