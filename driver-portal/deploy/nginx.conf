# Alternative à Caddy : /etc/nginx/sites-available/louage (puis certbot --nginx -d inscription.exemple.tn).
# Remplacer inscription.exemple.tn. Les chemins de certificat ci-dessous sont ceux créés par certbot.

# Journal d'accès SANS paramètres d'URL ($uri et non $request_uri) et sans en-têtes d'authentification.
log_format louage '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name inscription.exemple.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inscription.exemple.tn;

    ssl_certificate     /etc/letsencrypt/live/inscription.exemple.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inscription.exemple.tn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/louage-access.log louage;
    server_tokens off;
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        # Indispensables : TRUST_PROXY=1, le contrôle d'origine (anti-CSRF) et le HTTPS forcé de l'application en dépendent.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
