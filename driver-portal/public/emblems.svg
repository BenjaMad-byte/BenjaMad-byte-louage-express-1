  <!-- ============ LE LOUAGE — vue de côté, tourné vers la droite ============ -->
  <symbol id="louage" viewBox="0 0 78 40">
    <clipPath id="louage-body"><path d="M3 29V13a4 4 0 0 1 4-4h38l12 11h11a5 5 0 0 1 5 5v4z"/></clipPath>
