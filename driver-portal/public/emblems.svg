<?xml version="1.0" encoding="UTF-8"?>
<!-- Emblemes des villes + louage. Un symbole par ville, grille 64x64. Couleurs d accent heritees de la page via les variables CSS em et em2 (le mode sombre les redefinit). Usage: use href emblems.svg#kairouan -->
