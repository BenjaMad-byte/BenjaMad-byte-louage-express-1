      <circle cx="-3" cy="4" r="2.6" fill="#fff" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="-4.8" cy="-1.5" r="2.6" fill="#fff" stroke="currentColor" stroke-width="1.6"/>
